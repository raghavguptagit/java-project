services:
  mysql:
    image: mysql:8.4
    container_name: societysync-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-societysync}
      MYSQL_USER: ${DB_USERNAME:-societysync_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_change_me}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - societysync_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: societysync-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-societysync}
      DB_USERNAME: ${DB_USERNAME:-societysync_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      JWT_SECRET: ${JWT_SECRET:-replace_with_long_random_secret}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-4-hydrogen}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  societysync_mysql_data:
